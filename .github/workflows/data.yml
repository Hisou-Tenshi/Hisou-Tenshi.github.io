name: refresh site data

# Keeps static/data/{bangumi,repos}.json in sync with live sources.
# Both scripts are no-write-on-failure, so a bad night never blanks the site.

on:
  schedule:
    # hourly, at :17 to stay off the top-of-hour runner stampede (UTC)
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/data.yml'

permissions:
  contents: write

concurrency:
  group: refresh-site-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BANGUMI_API: ${{ secrets.BANGUMI_API }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh Bangumi collection counts
        run: node scripts/fetch-bangumi.mjs

      - name: Refresh curated repo metadata
        run: node scripts/fetch-repos.mjs

      - name: Commit data changes
        run: |
          set -e
          commit_data() {
            git add static/data
            if git diff --staged --quiet; then
              echo "no data changes"
              return 0
            fi
            git -c user.name='「全人類の緋想天」' -c user.email='268836736+ZenjinruiNoHisouten@users.noreply.github.com' commit -m 'chore(data): refresh bangumi/repo stats'
          }
          commit_data
          # main moves under us (hourly runs, content pushes) and both runs write
          # the same two JSON files, so rebasing would conflict: reset onto the
          # new tip and regenerate the snapshots instead.
          for i in 1 2 3; do
            if git push --quiet; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, regenerating on top of origin/main (attempt $i)"
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            node scripts/fetch-bangumi.mjs
            node scripts/fetch-repos.mjs
            commit_data
            sleep $((i * 3))
          done
          echo "::error::could not push the refreshed data files"
          exit 1
