name: purge-cloudflare-cache

# After Pages publishes, drop the changed URLs from the Cloudflare edge cache.
# Asset URLs are content-hashed (scripts/stamp-assets.mjs), so a changed css/js
# file already has a brand-new URL and needs no purge; this mainly refreshes the
# HTML documents, whose edge TTL is 60 s.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: purge-cache
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify asset URLs are stamped
        run: node scripts/stamp-assets.mjs --check

      - name: Wait for the GitHub Pages build of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          want="$GITHUB_SHA"
          for i in $(seq 1 40); do
            latest=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            sha=$(printf '%s' "$latest" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log((JSON.parse(d).commit||"").slice(0,40))}catch{console.log("")}})')
            st=$(printf '%s' "$latest" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).status||"")}catch{console.log("")}})')
            echo "[$i] pages build ${st:-?} ${sha:0:7}"
            if [ "$sha" = "$want" ] && [ "$st" = "built" ]; then exit 0; fi
            sleep 10
          done
          echo "::warning::Pages build not confirmed in time; purging anyway"
      - name: Purge changed URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          BASE_URL: https://tenshi.qzz.io
        run: node scripts/purge-cloudflare.mjs
