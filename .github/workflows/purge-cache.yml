name: purge-cloudflare-cache

# After Pages publishes, drop the changed URLs from the Cloudflare edge cache.
# Asset URLs are content-hashed (scripts/stamp-assets.mjs), so a changed css/js
# file already has a brand-new URL and needs no purge; this mainly refreshes the
# HTML documents, whose edge TTL is 60 s.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: purge-cache
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify asset URLs are stamped
        run: node scripts/stamp-assets.mjs --check

      - name: Wait for a fresh GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The data workflow commits every hour, so the latest build is often a
          # commit other than the one that triggered this run.  Waiting for the
          # exact SHA would always time out; instead wait until the latest build is
          # "built" AND newer than this job's start, then purge.
          started=$(date +%s)
          for i in $(seq 1 30); do
            latest=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            info=$(printf '%s' "$latest" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);console.log([j.status||"",j.commit||"",Date.parse(j.updated_at||0)/1000|0].join(" "))}catch{console.log("? - 0")}})')
            st=$(echo "$info" | cut -d" " -f1)
            sha=$(echo "$info" | cut -d" " -f2)
            upd=$(echo "$info" | cut -d" " -f3)
            echo "[$i] pages build ${st:-?} ${sha:0:7} updated=$upd"
            if [ "$st" = "built" ] && [ "${upd:-0}" -ge "$started" ]; then
              echo "pages build is fresh"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::No fresh Pages build within 300 s; purging anyway"

      - name: Purge changed URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          BASE_URL: https://tenshi.qzz.io
        run: node scripts/purge-cloudflare.mjs

      # Runs last so a drift report never blocks the purge itself.
      - name: Verify Projects copy is in sync
        run: node scripts/check-repos.mjs
